server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow uploads up to 10 MB (backend enforces its own 5 MB limit).
    # Without this nginx's default 1 MB cap causes HTTP/2 ERR_HTTP2_PROTOCOL_ERROR
    # mid-upload instead of a clean 413.
    client_max_body_size 10m;

    # Use Docker/Railway DNS so upstream is resolved at request time,
    # not at nginx startup — prevents crash when backend isn't yet reachable.
    resolver 1.1.1.1 valid=30s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # Long-lived cache for hashed Angular build artifacts
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API calls to the backend
    # Store in a local variable so the resolver directive applies at request time.
    location /api/ {
        set $backend $BACKEND_URL;
        proxy_pass                    $backend;
        proxy_ssl_verify              off;
        proxy_ssl_server_name         on;
        proxy_set_header Host         $proxy_host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout            60s;
        proxy_connect_timeout         10s;
        proxy_send_timeout            60s;
        # Stream the request body directly to the backend instead of
        # buffering it first — required for reliable multipart file uploads.
        proxy_request_buffering       off;
    }

    # Health endpoint (proxied to backend)
    location = /health {
        set $backend $BACKEND_URL;
        proxy_pass              $backend/health;
        proxy_ssl_verify        off;
        proxy_ssl_server_name   on;
        proxy_set_header Host   $proxy_host;
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
